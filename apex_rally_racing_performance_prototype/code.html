        const ResultsPage = () => {
            const chartRef = useRef(null);
            
            useEffect(() => {
                const container = chartRef.current;
                if (!container) return;
                const data = [10, 28, 53, 65, 65, 80];
                const maxPoints = 100;
                const pointsCount = data.length;
                const { width, height } = container.getBoundingClientRect();
                const stepX = width / (pointsCount - 1);
                
                let pointsHTML = '';
                let linesHTML = '';
                const getCoords = (index, value) => ({
                    x: index * stepX,
                    y: height - (value / maxPoints * height)
                });
                
                for (let i = 0; i < pointsCount; i++) {
                    const { x, y } = getCoords(i, data[i]);
                    pointsHTML += `<div class="chart-point group" style="left: ${x}px; top: ${y}px;">
                        <div class="absolute -top-8 -left-4 bg-background border border-surface-variant px-2 py-1 font-data-label text-[10px] text-primary opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">${data[i]} PTS</div>
                    </div>`;
                    if (i < pointsCount - 1) {
                        const next = getCoords(i + 1, data[i + 1]);
                        const len = Math.sqrt(Math.pow(next.x - x, 2) + Math.pow(next.y - y, 2));
                        const angle = Math.atan2(next.y - y, next.x - x) * 180 / Math.PI;
                        linesHTML += `<div class="chart-line" style="left: ${x}px; top: ${y}px; width: ${len}px; transform: rotate(${angle}deg);"></div>`;
                    }
                }
                container.innerHTML = linesHTML + pointsHTML;
            }, []);

            return (
                <div className="flex flex-col min-h-screen pt-[80px]">

                            <p className="font-body-lg text-on-surface-variant mt-4 max-w-2xl">Real-time performance telemetry and season aggregate data. Technical excellence quantified.</p>
                        </header>
                        
                        <section className="grid grid-cols-1 md:grid-cols-4 gap-gutter mb-section-gap">
                            {[
                                { id: '001', label: 'STARTS', val: '6', progress: '60%' },
                                { id: '002', label: 'PODIUMS', val: '4', progress: '66%', color: 'bg-primary' },
                                { id: '003', label: 'WINS', val: '1', progress: '16%', color: 'bg-primary-container', border: 'border-t-2 border-t-primary' },
                                { id: '004', label: 'FINISH RATE', val: '92%', progress: '92%' }
                            ].map(s => (
                                <div key={s.id} className={`tech-bg tech-border p-6 relative group hover:border-primary transition-colors ${s.border || ''}`}>
                                    <div className="absolute top-4 right-4 font-data-label text-data-label text-surface-variant">{s.id}</div>
                                    <div className="font-data-label text-data-label text-on-surface-variant mb-2">{s.label}</div>
                                    <div className="font-display-lg text-on-background">{s.val}</div>
                                    <div className="w-full h-1 bg-background mt-4">
                                        <div className={`h-full ${s.color || 'bg-surface-variant'}`} style={{width: s.progress}}></div>
                                    </div>
                                </div>
                            ))}
                        </section>

                        <section className="grid grid-cols-1 lg:grid-cols-12 gap-gutter mb-section-gap">
                            <div className="lg:col-span-8 tech-border p-8 tech-bg relative min-h-[400px]">
                                <div className="absolute top-4 right-4 font-data-label text-data-label text-surface-variant">CHART-01/PTS</div>
                                <h3 className="font-data-label text-data-label uppercase text-on-surface-variant mb-8 tracking-widest border-b border-surface-variant pb-2 inline-block">Championship Progression</h3>
                                <div className="chart-container mt-8 relative">
                                    <div className="absolute left-0 top-0 h-full w-8 flex flex-col justify-between font-data-label text-[10px] text-surface-variant z-10">
                                        <span>100</span><span>75</span><span>50</span><span>25</span><span>0</span>
                                    </div>
                                    <div className="chart-grid-line top-0"></div><div className="chart-grid-line top-1/4"></div><div className="chart-grid-line top-2/4"></div><div className="chart-grid-line top-3/4"></div><div className="chart-grid-line bottom-0"></div>
                                    <div className="absolute bottom-[-30px] left-8 right-0 flex justify-between font-data-label text-[10px] text-surface-variant z-10 px-4">
                                        <span>MC</span><span>SWE</span><span>CRO</span><span>POR</span><span>ITA</span><span>EST</span>

                                <div className="absolute inset-0 bg-gradient-to-t from-background via-transparent to-transparent"></div>
                                <div className="absolute bottom-6 left-6 right-6">
                                    <p className="font-data-label text-data-label text-on-surface-variant mb-2">LATEST METRIC</p>
                                    <p className="font-body-md text-on-background">Peak G-Force recorded at 1.8G during SS4.</p>
                                </div>
                            </div>
                        </section>

                        <section className="mb-section-gap overflow-x-auto">
                            <table className="w-full text-left border-collapse min-w-[800px]">

                                    <tr className="border-b border-surface-variant">
                                        <th className="py-4 px-4 font-data-label text-data-label text-on-surface-variant uppercase">Event</th>
                                        <th className="py-4 px-4 font-data-label text-data-label text-on-surface-variant uppercase">Date</th>
                                        <th className="py-4 px-4 font-data-label text-data-label text-on-surface-variant uppercase">Ovr Pos</th>
                                        <th className="py-4 px-4 font-data-label text-data-label text-on-surface-variant uppercase">Cls Pos</th>
                                        <th className="py-4 px-4 font-data-label text-data-label text-on-surface-variant uppercase text-right">Pts</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {[
                                        { name: 'Rally Estonia', date: 'JUL 20-23', ovr: 'P3', cls: 'P2', pts: 15 },
                                        { name: 'Croatia Rally', date: 'APR 20-23', ovr: 'P1', cls: 'P1', pts: 25, highlight: true },
                                        { name: 'Rally Sweden', date: 'FEB 09-12', ovr: 'P2', cls: 'P2', pts: 18 }
                                    ].map(r => (
                                        <tr key={r.name} className={`border-b border-surface-variant/30 hover:bg-surface-variant/10 transition-colors group ${r.highlight ? 'bg-surface-variant/5' : ''}`}>
                                            <td className="py-4 px-4 flex items-center gap-3">

                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </section>
                    </main>
                </div>
            );
        };

        const App = () => {
            return (
                <MemoryRouter>

                    <Routes>
                        <Route path="/" element={<HomePage />} />
                        <Route path="/driver" element={<DriverPage />} />
                        <Route path="/results" element={<ResultsPage />} />

                        <Route path="*" element={<HomePage />} />

                    <Footer />

            );
        };

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<App />);
    </script>
</body>
