        const ResultsPage = () => {
            const chartRef = useRef(null);

            useEffect(() => {
                const container = chartRef.current;
                if (!container) return;

                const data = [10, 28, 53, 65, 65, 80];
                const maxPoints = 100;
                const pointsCount = data.length;
                const containerRect = container.getBoundingClientRect();
                const width = containerRect.width;
                const height = containerRect.height;
                const stepX = width / (pointsCount - 1);

                const getCoords = (index, value) => ({
                    x: index * stepX,
                    y: height - (value / maxPoints * height)
                });

                container.innerHTML = ''; // Clear previous

                data.forEach((val, i) => {
                    const { x, y } = getCoords(i, val);
                    // Point
                    const point = document.createElement('div');
                    point.className = 'chart-point';
                    point.style.left = `${x}px`;
                    point.style.top = `${y}px`;
                    container.appendChild(point);

                    // Line
                    if (i < pointsCount - 1) {
                        const nextCoords = getCoords(i + 1, data[i + 1]);
                        const length = Math.sqrt(Math.pow(nextCoords.x - x, 2) + Math.pow(nextCoords.y - y, 2));
                        const angle = Math.atan2(nextCoords.y - y, nextCoords.x - x) * 180 / Math.PI;
                        const line = document.createElement('div');
                        line.className = 'chart-line';
                        line.style.left = `${x}px`;
                        line.style.top = `${y}px`;
                        line.style.width = `${length}px`;
                        line.style.transform = `rotate(${angle}deg)`;
                        container.appendChild(line);
                    }
                });
            }, []);

                                ].map(stat => (
                                    <div key={stat.id} className={`bg-[#1A1A1A] technical-border p-6 relative group ${stat.primary ? 'border-t-2 border-t-racing-red' : 'hover:border-racing-red'} transition-colors`}>

                                        <div className="font-data-label text-data-label text-on-surface-variant mb-2 uppercase">{stat.label}</div>
                                        <div className={`font-display-lg ${stat.primary ? 'text-primary' : 'text-on-background'}`}>{stat.val}</div>
                                        <div className="w-full h-1 bg-background mt-4">

                                        </div>
                                    </div>
                                ))}
