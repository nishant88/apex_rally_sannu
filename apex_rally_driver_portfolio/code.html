                                <img className="w-full h-full object-cover mix-blend-luminosity opacity-40" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBe6jcSpNbkM3_VfYI8DysK7_WXiRmMQp_7gOWk0Pgf1GYSAlN3fYZiCvOBpIqu79zr2G51MrCytF12vY7Jgugf4PIVLYMmZc0vW5_RoQsx3m0JcEDnQS4wdSnVWtr5pgcHxwcGdVn8LtS5OdToirzUFjMkPj19zFlmGfJm7lTE1tUje4un0IbofaLEdm07roFlp-NkJYlCPL3f9-tF_Bd0xb7UbmGM2bpvYSysweorpNs-DxHMb8ky" alt="Rally Action"/>
                            </div>
                            <div className="relative z-10 max-w-4xl grid gap-8">
                                <div className="flex items-center gap-4">
                                    <span className="font-data-label text-data-label text-primary bg-surface-container px-3 py-1 border border-[#252525] uppercase">SPONSORSHIP PLATFORM</span>
                                    <div className="h-[1px] bg-[#252525] w-24"></div>
                                    <span className="font-data-label text-data-label text-on-surface-variant">SYS.VOL.01</span>
                                </div>
                                <h1 className="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-background uppercase">
                                    PUT YOUR BRAND ON <br/> <span className="text-transparent" style={{ WebkitTextStroke: '1px #e2e2e2' }}>THE JOURNEY</span>
                                </h1>
                                <button className="bg-racing-red text-white font-data-label text-data-label uppercase tracking-widest px-8 py-4 hover:bg-on-primary-fixed-variant transition-colors self-start">
                                    START THE CONVERSATION
                                </button>
                            </div>
                        </section>

                        <section className="px-margin-mobile md:px-margin-desktop py-16 border-y border-[#252525] bg-surface-container-lowest grid grid-cols-1 md:grid-cols-3 gap-8">
                            {[{t: 'Total Audience Reach', v: '1.2M+', w: '85%'}, {t: 'Event Attendance', v: '15k Avg.', w: '60%'}, {t: 'Engagement Rate', v: '4.2%', w: '92%'}].map((m, i) => (
                                <div key={i} className="glass-panel p-6 technical-border relative overflow-hidden group">
                                    <h3 className="font-data-label text-data-label text-primary mb-2 uppercase">{m.t}</h3>
                                    <div className="font-headline-md text-headline-md text-on-background mb-4 uppercase">{m.v}</div>
                                    <div className="h-1 bg-[#1A1A1A] w-full">
                                        <div className="h-full bg-racing-red transition-all duration-1000" style={{ width: m.w }}></div>
                                    </div>
                                </div>
                            ))}
                        </section>

                        <section className="px-margin-mobile md:px-margin-desktop py-section-gap bg-surface-container-lowest border-y border-[#252525]">
                            <div className="mb-12">
                                <h2 className="font-headline-md text-headline-md text-on-background uppercase mb-2">Livery Mapping</h2>
                                <p className="font-data-label text-data-label text-on-surface-variant uppercase">Interactive Branding Zones</p>
                            </div>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-gutter items-center">
                                <div className="space-y-4">
                                    <div className="p-6 tech-border bg-surface-container border-l-2 border-l-primary">
                                        <div className="flex justify-between items-start mb-2">
                                            <h3 className="font-body-lg text-body-lg text-on-background font-bold uppercase">{selectedZone.title}</h3>
                                            <span className="font-data-label text-data-label text-primary bg-[#1A1A1A] px-2 py-1">VIS: {selectedZone.visibility}</span>
                                        </div>
                                        <p className="font-data-label text-data-label text-on-surface-variant uppercase">{selectedZone.desc}</p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        {[
                                            {id: 'ZN.01', name: 'Bonnet', desc: 'Primary frontal exposure. High visibility in broadcast.', vis: '90%'},
                                            {id: 'ZN.02', name: 'Doors', desc: 'Maximum lateral exposure. Ideal for title partners.', vis: '85%'},
                                            {id: 'ZN.03', name: 'Roof', desc: 'Aerial broadcast visibility.', vis: '70%'},
                                            {id: 'ZN.04', name: 'Rear', desc: 'High dwell time during pursuit footage.', vis: '65%'}
                                        ].map(z => (
                                            <div key={z.id} className="p-4 tech-border bg-surface-container-low text-center cursor-pointer hover:border-primary transition-colors" onClick={() => updateZone(z.name, z.desc, z.vis)}>
                                                <span className="font-data-label text-data-label text-primary">{z.id}</span>
                                                <div className="font-body-md text-body-md text-on-background uppercase mt-1">{z.name}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="p-8 tech-border bg-[#0A0A0A] flex justify-center items-center min-h-[400px] relative">
                                    <svg className="w-full max-w-lg z-10" viewBox="0 0 500 250">
                                        <path d="M50,150 L100,100 L250,90 L350,100 L450,130 L450,180 L50,180 Z" fill="none" stroke="#474746" strokeWidth="2"></path>
                                        <polygon className="zone-highlight" fill="rgba(71, 71, 70, 0.2)" points="110,105 240,95 240,115 110,125" stroke="#474746" strokeWidth="1" onClick={() => updateZone('Bonnet', 'Primary frontal exposure. High visibility in broadcast.', '90%')}></polygon>
                                        <rect className="zone-highlight" x="250" y="110" width="90" height="40" fill="rgba(71, 71, 70, 0.2)" stroke="#474746" strokeWidth="1" onClick={() => updateZone('Doors', 'Maximum lateral exposure. Ideal for title partners.', '85%')}></rect>
                                    </svg>
                                    <div className="absolute bottom-4 right-4 font-data-label text-data-label text-on-surface-variant uppercase">Livery.Schematic.v1</div>
                                </div>
                            </div>
                        </section>
                    </main>
                </div>
            );
        };

        const ResultsPage = () => {
            const chartRef = useRef(null);

            useEffect(() => {
                const container = chartRef.current;
                if (!container) return;
                
                const data = [10, 28, 53, 65, 65, 80];
                const maxPoints = 100;
                const pointsCount = data.length;
                const containerRect = container.getBoundingClientRect();
                const width = containerRect.width;
                const height = containerRect.height;
                const stepX = width / (pointsCount - 1);
                
                let pointsHTML = '';
                let linesHTML = '';
                
                const getCoords = (index, value) => ({
                    x: index * stepX,
                    y: height - (value / maxPoints * height)
                });
                
                for (let i = 0; i < pointsCount; i++) {
                    const { x, y } = getCoords(i, data[i]);
                    pointsHTML += `<div class="chart-point" style="left: ${x}px; top: ${y}px;"></div>`;
                    if (i < pointsCount - 1) {
                        const next = getCoords(i + 1, data[i + 1]);
                        const length = Math.sqrt(Math.pow(next.x - x, 2) + Math.pow(next.y - y, 2));
                        const angle = Math.atan2(next.y - y, next.x - x) * 180 / Math.PI;
                        linesHTML += `<div class="chart-line" style="left: ${x}px; top: ${y}px; width: ${length}px; transform: rotate(${angle}deg);"></div>`;
                    }
                }
                container.innerHTML = linesHTML + pointsHTML;
            }, []);

            const events = [
                { name: 'Rally Estonia', date: 'JUL 20-23', cat: 'WRC2', ovr: 'P3', cls: 'P2', pts: 15 },
                { name: 'Rally Italia Sardegna', date: 'JUN 01-04', cat: 'WRC2', ovr: 'DNF', cls: 'DNF', pts: 0 },
                { name: 'Rally de Portugal', date: 'MAY 11-14', cat: 'WRC2', ovr: 'P4', cls: 'P3', pts: 12 },
                { name: 'Croatia Rally', date: 'APR 20-23', cat: 'WRC2', ovr: 'P1', cls: 'P1', pts: 25 },
                { name: 'Rally Sweden', date: 'FEB 09-12', cat: 'WRC2', ovr: 'P2', cls: 'P2', pts: 18 },
                { name: 'Rallye Monte-Carlo', date: 'JAN 19-22', cat: 'WRC2', ovr: 'P5', cls: 'P4', pts: 10 }
            ];

            return (
                <div className="bg-background text-on-background font-body-md pt-[80px]">
                    <main className="max-w-[1440px] mx-auto px-margin-mobile md:px-margin-desktop py-12 md:py-24">
                        <header className="mb-section-gap border-b border-surface-variant pb-8 relative">
                            <h1 className="font-display-lg-mobile md:font-display-lg text-primary uppercase">TRACKING THE PACE</h1>
                            <p className="font-body-lg text-on-surface-variant mt-4 max-w-2xl">Real-time performance telemetry and season aggregate data.</p>
                        </header>

                        <section className="mb-section-gap grid grid-cols-1 md:grid-cols-4 gap-gutter">
                            {[
                                {l: 'Starts', v: '6', w: '60%'}, {l: 'Podiums', v: '4', w: '66%'}, {l: 'Wins', v: '1', w: '16%'}, {l: 'Finish Rate', v: '92%', w: '92%'}
                            ].map((s, i) => (
                                <div key={i} className="tech-bg tech-border p-6 relative group hover:border-primary transition-colors">
                                    <div className="font-data-label text-data-label text-on-surface-variant mb-2 uppercase">{s.l}</div>
                                    <div className="font-display-lg text-on-background uppercase">{s.v}</div>
                                    <div className="w-full h-1 bg-background mt-4">
                                        <div className="h-full bg-primary" style={{ width: s.w }}></div>
                                    </div>
                                </div>
                            ))}
                        </section>

                        <section className="mb-section-gap">
                            <div className="tech-border p-8 tech-bg relative h-[450px]">
                                <h3 className="font-data-label text-data-label uppercase text-on-surface-variant mb-8 tracking-widest border-b border-surface-variant pb-2 inline-block">Championship Progression</h3>
                                <div className="chart-container mt-8">
                                    <div className="absolute left-0 top-0 h-full w-8 flex flex-col justify-between font-data-label text-[10px] text-surface-variant z-10">
                                        <span>100</span><span>75</span><span>50</span><span>25</span><span>0</span>
                                    </div>
                                    {[0, 0.25, 0.5, 0.75, 1].map(p => <div key={p} className="chart-grid-line" style={{ top: `${p*100}%` }}></div>)}
                                    <div ref={chartRef} className="absolute left-8 right-0 top-0 bottom-0"></div>
                                </div>
                            </div>
                        </section>

                        <section className="mb-section-gap overflow-x-auto">
                            <table className="w-full text-left border-collapse min-w-[800px]">
                                <thead>
                                    <tr className="border-b border-surface-variant">
                                        {['Event', 'Date', 'Champ', 'Cls Pos', 'Stg Wins', 'Pts'].map(h => (
                                            <th key={h} className="py-4 px-4 font-data-label text-data-label text-on-surface-variant font-normal tracking-widest uppercase">{h}</th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody className="font-body-md text-on-background">
                                    {events.map((e, i) => (
                                        <tr key={i} className="border-b border-surface-variant/30 hover:bg-surface-variant/10 transition-colors group">
                                            <td className="py-4 px-4">{e.name}</td>
                                            <td className="py-4 px-4 font-data-label text-[13px]">{e.date}</td>
                                            <td className="py-4 px-4"><span className="bg-surface-variant text-on-background px-2 py-1 text-xs font-data-label rounded-sm uppercase">{e.cat}</span></td>
                                            <td className="py-4 px-4 font-bold text-primary uppercase">{e.cls}</td>
                                            <td className="py-4 px-4">3</td>
                                            <td className="py-4 px-4 font-data-label text-primary">{e.pts}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </section>
                    </main>
                </div>
            );
        };

        // --- Main App ---

        const App = () => {
            // Force scroll to top on navigation
            const { pathname } = useLocation();
            useEffect(() => {
                window.scrollTo(0, 0);
            }, [pathname]);

            return (
                <div className="flex flex-col min-h-screen">
                    <Navigation />
                    <div className="flex-grow">
                        <Routes>
                            <Route path="/" element={<HomePage />} />
                            <Route path="/driver" element={<DriverPage />} />
                            <Route path="/results" element={<ResultsPage />} />
                            <Route path="/sponsorship" element={<SponsorshipPage />} />
                        </Routes>
                    </div>
                    <Footer />
                </div>
            );
        };

        const Root = () => (
            <MemoryRouter>
                <App />
            </MemoryRouter>
        );

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<Root />);
    </script>
</body>
</html>
